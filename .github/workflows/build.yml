name: Build PI-FINDER

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows executable
        run: pyinstaller --onefile --clean --name PI-FINDER-Windows pi_finder.py

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\PI-FINDER-Windows | Out-Null
          Copy-Item dist\PI-FINDER-Windows.exe release\PI-FINDER-Windows\
          Copy-Item pi.txt release\PI-FINDER-Windows\
          Compress-Archive -Path release\PI-FINDER-Windows -DestinationPath PI-FINDER-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PI-FINDER-Windows
          path: PI-FINDER-Windows.zip

      - name: Upload Windows release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PI-FINDER-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Linux executable
        run: pyinstaller --onefile --clean --name PI-FINDER-Linux pi_finder.py

      - name: Package Linux release
        run: |
          mkdir -p release/PI-FINDER-Linux
          cp dist/PI-FINDER-Linux release/PI-FINDER-Linux/
          cp pi.txt release/PI-FINDER-Linux/
          tar -czf PI-FINDER-Linux.tar.gz -C release PI-FINDER-Linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PI-FINDER-Linux
          path: PI-FINDER-Linux.tar.gz

      - name: Upload Linux release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PI-FINDER-Linux.tar.gz

  build-macos:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Intel Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Intel executable
        run: pyinstaller --onefile --clean --name PI-FINDER-macOS-Intel pi_finder.py

      - name: Upload Intel build
        uses: actions/upload-artifact@v4
        with:
          name: PI-FINDER-macOS-Intel
          path: dist/PI-FINDER-macOS-Intel

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Apple Silicon Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: arm64

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Apple Silicon executable
        run: pyinstaller --onefile --clean --name PI-FINDER-macOS-Apple-Silicon pi_finder.py

      - name: Upload Apple Silicon build
        uses: actions/upload-artifact@v4
        with:
          name: PI-FINDER-macOS-Apple-Silicon
          path: dist/PI-FINDER-macOS-Apple-Silicon

  package-macos:
    needs:
      - build-macos
      - build-macos-arm64
    runs-on: macos-14
    steps:
      - name: Download Intel build
        uses: actions/download-artifact@v4
        with:
          name: PI-FINDER-macOS-Intel
          path: intel

      - name: Download Apple Silicon build
        uses: actions/download-artifact@v4
        with:
          name: PI-FINDER-macOS-Apple-Silicon
          path: arm64

      - name: Create Universal macOS executable
        run: |
          chmod +x intel/PI-FINDER-macOS-Intel
          chmod +x arm64/PI-FINDER-macOS-Apple-Silicon
          lipo -create             intel/PI-FINDER-macOS-Intel             arm64/PI-FINDER-macOS-Apple-Silicon             -output PI-FINDER-macOS

      - name: Package macOS release
        run: |
          mkdir -p release/PI-FINDER-macOS
          cp PI-FINDER-macOS release/PI-FINDER-macOS/
          cp pi.txt release/PI-FINDER-macOS/
          chmod +x release/PI-FINDER-macOS/PI-FINDER-macOS
          tar -czf PI-FINDER-macOS.tar.gz -C release PI-FINDER-macOS

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PI-FINDER-macOS
          path: PI-FINDER-macOS.tar.gz

      - name: Upload macOS release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PI-FINDER-macOS.tar.gz
